[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-dense-sparse-fusion-reranker"
version = "0.1.0"
description = "Reciprocal Rank Fusion (RRF) combining dense semantic embeddings with BM25 lexical keyword scores"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
hybrid-dense-sparse-fusion-reranker = "hybrid_dense_sparse_fusion_reranker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hybrid_dense_sparse_fusion_reranker*"]
